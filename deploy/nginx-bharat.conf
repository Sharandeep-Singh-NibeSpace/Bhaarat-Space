# Bharat Space only. Included from inside the existing port-80 server block.
# The browser uses /Bharat. Next.js serves the built app at / on port 3010,
# and the HTML already points assets and links at /Bharat. These locations
# strip that prefix before proxying. No other site is mentioned here.

location = /Bharat {
    rewrite ^ / break;
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_redirect / /Bharat/;
}

location ^~ /Bharat/ {
    rewrite ^/Bharat/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_redirect / /Bharat/;
}
